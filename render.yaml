services:
  - type: web
    name: farmconnect-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:socket_app --host 0.0.0.0 --port 5000
    envVars:
      - key: PORT
        value: 5000
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
